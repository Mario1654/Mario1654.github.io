<style>     .marco-hojas-css {
            padding: 30px;
            margin: 20px;
            width: 80%;
            background-color: #e0ffe0; /* Fondo verde claro */
            border: 5px solid #006400; /* Borde verde oscuro */
            border-radius: 15px; /* Bordes redondeados */
            box-shadow: 0 0 15px 5px rgba(0, 128, 0, 0.3); /* Sombra verde */
        }</style><style>nav {
            display: flex;
            justify-content: center;
            background-color: #ff0080;
            padding: 1rem;
            flex-wrap: wrap;
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #fff;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        nav a:hover {
            transform: scale(1.2);
            text-shadow: 2px 2px 4px #000;
        }

        .main {
            padding: 2rem;
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            justify-items: center;
        }

        .product {
            background: #ff96c5;
            border-radius: 10px;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
            padding: 1rem;
            text-align: center;
            transition: transform 0.3s;
        }

        .product:hover {
            transform: scale(1.1);
        }

        .product img {
            max-width: 100%;
            border-radius: 5px;
        }

        footer {
            background: #CA0CA0;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
            font-size: 1rem;
        }

        .circulo img {
            display: block;
            margin: 1rem auto;
            border-radius: 50%;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            nav a {
                font-size: 1rem;
            }

            .main h2 {
                font-size: 1.2rem;
            }

            .product {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            nav {
                flex-direction: column;
            }

            nav a {
                margin: 0.5rem 0;
            }

            .product {
                width: 100%;
            }
			}</style>
